services:
  backend-db:
    image: postgres:15
    container_name: campusflow-backend-db
    environment:
      POSTGRES_DB: campusflow
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow
    ports:
      - "5456:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U campusflow -d campusflow" ]
      interval: 5s
      timeout: 5s
      retries: 10

  capacity-db:
    image: postgres:15
    container_name: campusflow-capacity-db
    environment:
      POSTGRES_DB: capacitydb
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow
    ports:
      - "5455:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U campusflow -d capacitydb" ]
      interval: 5s
      timeout: 5s
      retries: 10

  capacity-service:
    build:
      context: ./capacity-service
    container_name: campusflow-capacity
    depends_on:
      capacity-db:
        condition: service_healthy
    environment:
      DB_HOST: capacity-db
      DB_PORT: 5432
      DB_NAME: capacitydb
      DB_USER: campusflow
      DB_PASSWORD: campusflow
      SERVER_PORT: 4092
    ports:
      - "4092:4092"

  backend:
    build:
      context: ./backend
    container_name: campusflow-backend
    depends_on:
      backend-db:
        condition: service_healthy
      capacity-service:
        condition: service_started
    environment:
      DB_HOST: backend-db
      DB_PORT: 5432
      DB_NAME: campusflow
      DB_USER: campusflow
      DB_PASSWORD: campusflow
      SERVER_PORT: 4091
      CAPACITY_BASE_URL: http://capacity-service:4092
    ports:
      - "4091:4091"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4091
    container_name: campusflow-frontend
    depends_on:
      - backend
    ports:
      - "4090:80"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: campusflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: campusflow-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: campusflow-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
